name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Repo must contain both xdv-os and dust (e.g. dustlang monorepo)

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build dust compiler
        run: |
          if [ -d dust ]; then
            cd dust && cargo build --release 2>/dev/null || cargo build
          else
            echo "No dust/ in repo; assuming dust is on PATH or will be built by build.sh"
          fi

      - name: Build xdv-os (dust + NASM)
        run: |
          chmod +x xdv-os/src/build.sh
          ./xdv-os/src/build.sh

      - name: Verify disk image
        run: |
          [ -f xdv-os/src/xdv-os.img ] || exit 1
          ls -la xdv-os/src/xdv-os.img
          xxd -s 510 xdv-os/src/xdv-os.img -l 2

      - name: Verify components
        run: |
          [ -d xdv-os/xdv-boot ] && [ -d xdv-os/xdv-kernel ] && [ -d xdv-os/xdv-runtime ] && \
          [ -d xdv-os/xdv-shell ] && [ -d xdv-os/xdv-xdvfs ] || exit 1
          echo "All components present"

      - name: Upload xdv-os.img
        uses: actions/upload-artifact@v4
        with:
          name: xdv-os-img
          path: xdv-os/src/xdv-os.img
