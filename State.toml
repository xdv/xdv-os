# XDV OS Workspace Manifest
# Complete XDV Operating System

[workspace]
name = "xdv_os"
version = "0.2.0"
description = "XDV OS - Complete Operating System in DPL"

[workspace.sectors]
xdv_boot = "../xdv-boot"
xdv_kernel = "../xdv-kernel"
xdv_dal = "../xdv-dal"
xdv_cds = "../xdv-cds"
xdv_umf = "../xdv-umf"
xdv_hypervisor = "../xdv-hypervisor"
xdv_sdbm = "../xdv-sdbm"
xdv_xdvfs = "../xdv-xdvfs"
xdv_runtime = "../xdv-runtime"
xdv_shell = "../xdv-shell"
dustlib = "../dustlib"
dustlib_k = "../dustlib-k"
dust_runtime = "../dust-runtime"

[workspace.entrypoints]
xdv_os = "src/xdv_os_boot_contract.ds"
xdv_boot = "../xdv-boot/src/boot_loader_profile.ds"
xdv_kernel = "../xdv-kernel/sector/xdv_kernel/src/kernel.ds"
xdv_dal = "../xdv-dal/src/dal.ds"
xdv_cds = "../xdv-cds/src/cds.ds"
xdv_umf = "../xdv-umf/src/umf.ds"
xdv_hypervisor = "../xdv-hypervisor/src/hypervisor.ds"
xdv_sdbm = "../xdv-sdbm/src/sdbm.ds"
xdv_xdvfs = "../xdv-xdvfs/src/xdvfs_mount.ds"
xdv_runtime = "../xdv-runtime/src/runtime_bridge.ds"
xdv_shell = "../xdv-shell/src/shell_bridge.ds"
dustlib = "../dustlib/sector/dustlib_core/src/xdv_os_bridge.ds"
dustlib_k = "../dustlib-k/sector/dustlib-k/lib.ds"
dust_runtime = "../dust-runtime/src/runtime_bridge.ds"

[target.x64-pc-none]
linker = "ld"
linker_flags = ["-nostdlib", "-static"]

